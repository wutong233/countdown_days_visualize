name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（如 1.0.0）'
        required: false
        default: '1.0.0'
      prerelease:
        description: '是否标记为预发布'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'
          platform-tools: true
          cmdline-tools: 'latest'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sync web assets into Android project
        shell: bash
        run: |
          set -e
          DEST=app/src/main/assets/web
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # 复制 web 资产：HTML/CSS/JS，排除 Android 项目、构建产物、截图
          rsync -a --delete \
            --exclude='android' \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='screenshots' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='LICENSE' \
            ../ "$DEST/"
          echo "==== Synced files ===="
          find "$DEST" -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          build-root-directory: android

      - name: Generate wrapper (if missing)
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build debug APK (sanity check)
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        shell: bash
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version_name }}"
          else
            V="1.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V" >> $GITHUB_OUTPUT

      - name: Rename APK
        shell: bash
        run: |
          cp "${{ steps.apk.outputs.apk_path }}" \
             "countdown-${{ steps.ver.outputs.version }}.apk"
          ls -lh countdown-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: countdown-apk
          path: android/countdown-*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 倒数日 ${{ steps.ver.outputs.version }}
          body: |
            # 倒数日 Android ${{ steps.ver.outputs.version }}

            由 GitHub Actions 自动构建。安装方法：
            1. 下载下方 `countdown-*.apk`
            2. 手机设置允许「安装未知来源应用」
            3. 点击 APK 安装

            Commit: ${{ github.sha }}
            构建时间: ${{ github.run_id }}
          files: android/countdown-*.apk
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

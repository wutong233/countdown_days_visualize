<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="left-big">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eaf0f8">
<title>倒数日</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panel.css">
</head>
<body>
<div id="bgLayer"></div>
<div id="bgDim"></div>
<div id="drift">
  <div class="grids">
    <div class="grid-box" id="todayGrid" title="今日时间流逝"></div>
    <div class="grid-divider" aria-hidden="true"></div>
    <div class="grid-box" id="totalGrid" title="总时间流逝"></div>
  </div>
</div>
<div class="hero">
  <div class="hero-name glass pill" id="heroName"></div>
  <div class="vessel glass" id="vessel">
    <div class="vessel-content">
      <span id="days">--</span>
      <span class="unit-stack"><span class="unit">天</span><span class="dir" id="dir"></span></span>
    </div>
  </div>
  <div class="datetime glass pill" id="dateTime">--:--:-- · ----.--.--</div>
</div>
<div class="chrome">
  <div class="pct-label glass pill">今日 <b id="todayPct">0.0%</b></div>
  <div class="actions">
    <div class="pct-label glass pill">总进度 <b id="totalPct">0.0%</b></div>
    <button class="icon-btn glass" id="btnTheme" title="切换主题（T）">
      <svg id="icoSun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="icoOled" style="display:none" viewBox="0 0 24 24"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn glass" id="btnSettings" title="设置（S）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    </button>
    <button class="icon-btn glass" id="btnFull" title="全屏（F）">
      <svg id="icoExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg id="icoCollapse" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel">
  <div class="panel-head">
    <h2>设置</h2>
    <button class="icon-btn glass" id="btnClose" title="关闭" style="margin-left:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="field">
      <label class="title">事件名称</label>
      <input type="text" id="inName" maxlength="30" placeholder="如：高考加油、去往大海的日子">
    </div>
    <div class="row2">
      <div class="field"><label class="title">开始日期</label><input type="date" id="inStart"></div>
      <div class="field"><label class="title">目标日期</label><input type="date" id="inTarget"></div>
    </div>
    <div class="field">
      <label class="title">快速选择目标日</label>
      <div class="chips">
        <button class="chip" data-days="7">7 天后</button>
        <button class="chip" data-days="30">30 天后</button>
        <button class="chip" data-days="100">100 天后</button>
        <button class="chip" data-days="year">一年后</button>
      </div>
    </div>
    <div class="field">
      <label class="title">主题</label>
      <div class="seg" id="segTheme">
        <button data-theme="light">日间</button>
        <button data-theme="dark">暗色</button>
        <button data-theme="oled">OLED</button>
      </div>
    </div>
    <div class="field">
      <label class="title">配色方案</label>
      <div class="scheme-grid" id="schemeGrid"></div>
      <div class="scheme-edit" id="schemeEdit" style="margin-top:12px">
        <div class="fluid-color-row"><span>起始色</span><input type="color" id="inSchemeC1"></div>
        <div class="fluid-color-row"><span>结束色</span><input type="color" id="inSchemeC2"></div>
        <button class="bg-clear" id="btnResetScheme" style="margin-top:8px">重置当前方案</button>
      </div>
    </div>
    <div class="field">
      <label class="title">布局</label>
      <div class="seg" id="segLayout">
        <button data-layout="left-big">今日为主</button>
        <button data-layout="half">各占一半</button>
        <button data-layout="right-big">总进度为主</button>
      </div>
    </div>
    <div class="field">
      <label class="title">今日方格大小</label>
      <div class="range-wrap"><input type="range" id="inCellToday" min="9" max="48" step="1" value="30"><span class="val" id="cellTodayVal">30px</span></div>
    </div>
    <div class="field">
      <label class="title">总进度方格大小</label>
      <div class="range-wrap"><input type="range" id="inCellTotal" min="9" max="48" step="1" value="30"><span class="val" id="cellTotalVal">30px</span></div>
    </div>
    <div class="field" id="burnIntField" style="display:none">
      <label class="title">位移频率</label>
      <div class="range-wrap"><input type="range" id="inBurnInt" min="0" max="60" step="2" value="28"><span class="val" id="burnIntVal">28s</span></div>
    </div>
    <div class="field">
      <label class="title">今日进度样式</label>
      <div class="seg" id="segTodayStyle">
        <button data-style="grid">方格</button>
        <button data-style="liquid">波浪</button>
        <button data-style="fluid">流体</button>
        <button data-style="particles">粒子</button>
      </div>
    </div>
    <div class="field" id="toastField" style="display:none">
      <label class="switch toast-switch"><span class="toast-label">⚠ 烤鸡模式</span><input type="checkbox" id="inToast"><i class="knob"></i></label>
      <div class="toast-hint">极致粒子负载，仅用于压力测试，会显著拉高 GPU/CPU 功耗与发热。</div>
    </div>
    <div class="field" id="fluidColorField" style="display:none">
      <label class="title">流体颜色</label>
      <label class="switch"><span>自定义颜色</span><input type="checkbox" id="inFluidCustom"><i class="knob"></i></label>
      <div class="fluid-colors" id="fluidColors" style="display:none;margin-top:12px">
        <div class="fluid-color-row"><span>底部</span><input type="color" id="inFluidC1" value="#38bdf8"></div>
        <div class="fluid-color-row"><span>表面</span><input type="color" id="inFluidC2" value="#818cf8"></div>
      </div>
    </div>
    <div class="field">
      <label class="title">选项</label>
      <label class="switch"><span>防烧屏</span><input type="checkbox" id="inBurn"><i class="knob"></i></label>
    </div>
    <div class="field">
      <label class="title">自定义背景</label>
      <div class="bg-row">
        <div class="bg-preview" id="bgPreview"></div>
        <input type="file" id="inBg" accept="image/*">
        <button class="btn ghost" id="btnPickBg" style="flex:1">选择图片</button>
        <button class="bg-clear" id="btnClearBg">清除</button>
      </div>
      <div class="row2" style="margin-top:10px">
        <div class="field"><label class="title">背景模糊</label><div class="range-wrap"><input type="range" id="inBgBlur" min="0" max="30" step="1" value="0"><span class="val" id="bgBlurVal">0</span></div></div>
        <div class="field"><label class="title">背景压暗</label><div class="range-wrap"><input type="range" id="inBgDim" min="0" max="90" step="5" value="40"><span class="val" id="bgDimVal">40%</span></div></div>
      </div>
    </div>
    <div class="hint">快捷键：<kbd>F</kbd> 全屏 · <kbd>S</kbd> 设置 · <kbd>T</kbd> 切换主题 · <kbd>Esc</kbd> 关闭面板<br>双击方格区域也可切换全屏。<br>所有改动自动保存到本浏览器。</div>
  </div>
</aside>
<div class="crop-backdrop" id="cropBackdrop"></div>
<div class="crop-modal" id="cropModal">
  <div class="crop-panel glass">
    <div class="crop-head">
      <h3>裁切背景</h3>
      <button class="icon-btn glass" id="cropClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="crop-stage" id="cropStage">
      <div class="crop-wrap" id="cropWrap">
        <img id="cropImg" alt="">
        <div class="crop-rect" id="cropRect">
          <div class="crop-grid" aria-hidden="true"></div>
          <span class="hnd hnd-nw" data-h="nw"></span><span class="hnd hnd-n" data-h="n"></span><span class="hnd hnd-ne" data-h="ne"></span><span class="hnd hnd-e" data-h="e"></span><span class="hnd hnd-se" data-h="se"></span><span class="hnd hnd-s" data-h="s"></span><span class="hnd hnd-sw" data-h="sw"></span><span class="hnd hnd-w" data-h="w"></span>
        </div>
      </div>
    </div>
    <div class="crop-aspect" id="cropAspect">
      <button data-ratio="page" class="active">网页比例</button><button data-ratio="free">自由</button><button data-ratio="1.7778">16:9</button><button data-ratio="1.3333">4:3</button><button data-ratio="1.5">3:2</button><button data-ratio="1">1:1</button>
    </div>
    <div class="crop-actions"><button class="btn ghost" id="cropCancel">取消</button><button class="btn primary" id="cropConfirm">应用裁切</button></div>
  </div>
</div>
<script src="js/state.js"></script>
<script src="js/fluid.js?v=47"></script>
<script src="js/grid.js?v=41"></script>
<script src="js/tick.js"></script>
<script src="js/panel.js?v=45"></script>
<script src="js/main.js?v=44"></script>
</body>
</html>
